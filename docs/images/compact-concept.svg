<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 490" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative 3.5 inch Nextion Enhanced DMR screen</title>
  <desc id="desc">Compact radio touchscreen concept with DMR caller, talkgroup, connection status and touchscreen navigation. Not a compiled TFT screenshot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#14283a"/><stop offset="1" stop-color="#091623"/></linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#06121b" flood-opacity=".35"/></filter>
  </defs>
  <rect width="700" height="490" fill="#e9f0f4"/>
  <text x="47" y="40" font-family="Arial,sans-serif" font-size="16" font-weight="bold" letter-spacing="1.3" fill="#435f74">NEXTION ENHANCED • COMPACT CONCEPT</text>
  <rect x="75" y="66" width="550" height="369" rx="24" fill="#203142" filter="url(#s)"/>
  <rect x="91" y="82" width="518" height="337" rx="12" fill="url(#bg)"/>
  <path d="M103 82h494a12 12 0 0 1 12 12v50H91V94a12 12 0 0 1 12-12" fill="#133d52"/>
  <text x="111" y="116" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#ffffff">DMR</text>
  <rect x="194" y="94" width="106" height="37" rx="18" fill="#195947"/>
  <circle cx="213" cy="112" r="5" fill="#53e6b8"/>
  <text x="231" y="117" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#bbffe3">ACTIVE</text>
  <text x="585" y="115" text-anchor="end" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#a7e2f4">2E0LXY</text>
  <rect x="111" y="159" width="478" height="160" rx="12" fill="#162f43" stroke="#3a5b70"/>
  <text x="133" y="190" font-family="Arial,sans-serif" font-size="14" letter-spacing="1" fill="#87bed3">CALLER</text>
  <text x="133" y="241" font-family="Arial,sans-serif" font-size="44" font-weight="bold" fill="#ffffff">M0ABC</text>
  <text x="136" y="274" font-family="Arial,sans-serif" font-size="16" fill="#a3c5d8">ID 2345678</text>
  <path d="M326 181v115" stroke="#35556c"/>
  <text x="348" y="190" font-family="Arial,sans-serif" font-size="14" letter-spacing="1" fill="#87bed3">TALKGROUP</text>
  <text x="348" y="235" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#f7c36e">TG 91</text>
  <text x="348" y="264" font-family="Arial,sans-serif" font-size="17" fill="#d3e2ed">Worldwide</text>
  <text x="348" y="289" font-family="Arial,sans-serif" font-size="15" fill="#98b6c9">TS2 • CC1</text>
  <g font-family="Arial,sans-serif" font-size="16" font-weight="bold">
    <rect x="111" y="333" width="104" height="65" rx="10" fill="#1a6687" stroke="#5ebada"/><text x="163" y="371" text-anchor="middle" fill="white">HOME</text>
    <rect x="225" y="333" width="104" height="65" rx="10" fill="#1d394d" stroke="#43697f"/><text x="277" y="371" text-anchor="middle" fill="#d6edf8">MODES</text>
    <rect x="339" y="333" width="104" height="65" rx="10" fill="#1d394d" stroke="#43697f"/><text x="391" y="371" text-anchor="middle" fill="#d6edf8">SYSTEM</text>
    <rect x="453" y="333" width="136" height="65" rx="10" fill="#1d394d" stroke="#43697f"/><text x="521" y="371" text-anchor="middle" fill="#d6edf8">NEXT ›</text>
  </g>
  <text x="350" y="470" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#62778c">ILLUSTRATIVE UI — NOT A HARDWARE CAPTURE OR VERIFIED RELEASE</text>
